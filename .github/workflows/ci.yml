name: CI

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pytest>=8,<10" "mcp>=1,<2" "playwright>=1.45,<2" uv
      - working-directory: top-journal-search-lists
        run: python -m pytest -q -p no:cacheprovider
      - working-directory: top-journal-search-lists
        run: python scripts/catalog_lookup.py validate
      - working-directory: top-journal-search-lists
        run: python tests/_mcp_handshake.py
      - working-directory: top-journal-search-lists
        run: python tests/_mcpb_handshake.py
      - working-directory: top-journal-search-lists
        run: python tests/_mcpb_raw_handshake.py
      - working-directory: top-journal-search-lists
        run: python scripts/build_release.py --output release
      - working-directory: top-journal-search-lists
        run: python -c "from pathlib import Path; import zipfile; files = [Path('release/top-journal-search-lists_Skill.zip'), Path('release/cnki-search.mcpb'), Path('release/checksums.sha256')]; assert all(path.is_file() and path.stat().st_size > 0 for path in files); assert all(zipfile.ZipFile(path).namelist() for path in files[:2])"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: release-canonical-ubuntu-py3.11
          path: top-journal-search-lists/release

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pytest>=8,<10" "mcp>=1,<2" "playwright>=1.45,<2" uv
      - working-directory: top-journal-search-lists
        run: python -m pytest -q -p no:cacheprovider
      - working-directory: top-journal-search-lists
        run: python scripts/catalog_lookup.py validate
      - working-directory: top-journal-search-lists
        run: python tests/_mcp_handshake.py
      - working-directory: top-journal-search-lists
        run: python tests/_mcpb_handshake.py
      - working-directory: top-journal-search-lists
        run: python tests/_mcpb_raw_handshake.py
      - working-directory: top-journal-search-lists
        run: python scripts/build_release.py --output release
      - working-directory: top-journal-search-lists
        run: python -c "from pathlib import Path; import zipfile; files = [Path('release/top-journal-search-lists_Skill.zip'), Path('release/cnki-search.mcpb'), Path('release/checksums.sha256')]; assert all(path.is_file() and path.stat().st_size > 0 for path in files); assert all(zipfile.ZipFile(path).namelist() for path in files[:2])"
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and launch Chromium on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/cnki-home"
          export CODEX_HOME="$HOME/.codex"
          export CNKI_PYTHON=python
          mkdir -p "$HOME"
          sh top-journal-search-lists/installers/install.sh --codex
          test -x "$CODEX_HOME/runtimes/cnki-search/.venv/bin/python"
          test -f "$CODEX_HOME/config.toml"
      - name: Install and launch Chromium on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'cnki-home'
          $env:USERPROFILE = $testHome
          $env:APPDATA = Join-Path $testHome 'AppData\Roaming'
          $env:CODEX_HOME = Join-Path $testHome '.codex'
          New-Item -ItemType Directory -Path $env:APPDATA -Force | Out-Null
          & .\top-journal-search-lists\installers\install.ps1 -Codex -PythonExe python
          $runtimePython = Join-Path $env:CODEX_HOME 'runtimes\cnki-search\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $runtimePython -PathType Leaf)) { throw 'runtime Python was not installed' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:CODEX_HOME 'config.toml') -PathType Leaf)) { throw 'Codex config was not installed' }

  version-gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reject Python 3.10 before POSIX installation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/cnki-gate-home"
          export CODEX_HOME="$HOME/.codex"
          export CNKI_PYTHON=python
          set +e
          output=$(sh top-journal-search-lists/installers/install.sh --codex 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep 'Python 3.10'
          test ! -e "$CODEX_HOME"
      - name: Reject Python 3.10 before Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'cnki-gate-home'
          $env:USERPROFILE = $testHome
          $env:APPDATA = Join-Path $testHome 'AppData\Roaming'
          $env:CODEX_HOME = Join-Path $testHome '.codex'
          $rejected = $false
          try {
            & .\top-journal-search-lists\installers\install.ps1 -Codex -PythonExe python
          }
          catch {
            $rejected = $_.Exception.Message -match 'Python 3\.10'
          }
          if (-not $rejected) { throw 'Python 3.10 was not rejected by the Windows installer' }
          if (Test-Path -LiteralPath $env:CODEX_HOME) { throw 'version gate left a partial installation' }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff mypy "mcp>=1,<2" "playwright>=1.45,<2"
      - run: ruff check .
      - working-directory: top-journal-search-lists
        run: mypy scripts/
