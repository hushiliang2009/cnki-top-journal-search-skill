name: CI

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "mcp>=1,<2" "playwright>=1.45,<2" uv
      - working-directory: top-journal-search-lists
        run: python -m pytest -q -p no:cacheprovider
      - working-directory: top-journal-search-lists
        run: python scripts/catalog_lookup.py validate
      - working-directory: top-journal-search-lists
        run: python tests/_mcp_handshake.py
      - working-directory: top-journal-search-lists
        run: python tests/_mcpb_handshake.py
      - working-directory: top-journal-search-lists
        run: python scripts/build_release.py --output release
      - working-directory: top-journal-search-lists
        run: python -c "from pathlib import Path; import zipfile; files = [Path('release/top-journal-search-lists_Skill.zip'), Path('release/cnki-search.mcpb'), Path('release/checksums.sha256')]; assert all(path.is_file() and path.stat().st_size > 0 for path in files); assert all(zipfile.ZipFile(path).namelist() for path in files[:2])"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu-py${{ matrix.python-version }}
          path: top-journal-search-lists/release

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "mcp>=1,<2" "playwright>=1.45,<2" uv
      - working-directory: top-journal-search-lists
        run: python -m pytest -q -p no:cacheprovider
      - working-directory: top-journal-search-lists
        run: python scripts/catalog_lookup.py validate
      - working-directory: top-journal-search-lists
        run: python tests/_mcp_handshake.py
      - working-directory: top-journal-search-lists
        run: python tests/_mcpb_handshake.py
      - working-directory: top-journal-search-lists
        run: python scripts/build_release.py --output release
      - working-directory: top-journal-search-lists
        run: python -c "from pathlib import Path; import zipfile; files = [Path('release/top-journal-search-lists_Skill.zip'), Path('release/cnki-search.mcpb'), Path('release/checksums.sha256')]; assert all(path.is_file() and path.stat().st_size > 0 for path in files); assert all(zipfile.ZipFile(path).namelist() for path in files[:2])"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-py${{ matrix.python-version }}
          path: top-journal-search-lists/release

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff mypy "mcp>=1,<2" "playwright>=1.45,<2"
      - run: ruff check .
      - working-directory: top-journal-search-lists
        run: mypy scripts/
